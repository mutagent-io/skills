name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default to read-only. Jobs that need more must opt in explicitly.
permissions:
  contents: read

jobs:
  sanitization:
    name: Sanitization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify no internal references leaked
        run: ./scripts/sanitize.py --check

  agent-skills-spec:
    name: Agent Skills spec (skills-ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go (skills-ref toolchain)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install skills-ref
        # The skills-ref reference validator lives under agentskills/agentskills.
        # If installation via `go install` ever changes, update the URL here.
        run: |
          set -euo pipefail
          if ! go install github.com/agentskills/agentskills/skills-ref/cmd/skills-ref@latest; then
            echo "::error::Failed to install skills-ref from agentskills/agentskills." \
                 "Update the install path or fall back to a vendored validator." >&2
            exit 1
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate every skill against the Agent Skills spec
        run: |
          set -euo pipefail
          fail=0
          for skill_md in $(find skills -mindepth 2 -maxdepth 2 -name SKILL.md); do
            skill_dir=$(dirname "$skill_md")
            echo "→ skills-ref validate $skill_dir"
            if ! skills-ref validate "$skill_dir"; then
              fail=1
            fi
          done
          exit $fail

  marketplace-spec:
    name: Claude Code marketplace spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace + plugin wrapper
        run: claude plugin validate .
