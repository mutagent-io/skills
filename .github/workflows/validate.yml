name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default to read-only. Jobs that need more must opt in explicitly.
permissions:
  contents: read

jobs:
  sanitization:
    name: Sanitization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify no internal references leaked
        run: ./scripts/sanitize.py --check

  agent-skills-spec:
    name: Agent Skills spec (skills-ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python (skills-ref toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install skills-ref
        # skills-ref moved from Go to a Python package under the upstream
        # monorepo. Pin the source commit so validation is reproducible.
        run: |
          set -euo pipefail
          python -m pip install \
            "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"

      - name: Validate skill content against the Agent Skills spec
        run: |
          set -euo pipefail
          fail=0

          # Validate the spec-shaped skills/<name>/ directories. During the
          # single-skill phase, mirror-check separately proves that the root
          # crawler bundle is byte-identical to skills/mutagent-cli/.
          if [[ -d skills ]]; then
            for skill_md in $(find skills -mindepth 2 -maxdepth 2 -name SKILL.md); do
              skill_dir=$(dirname "$skill_md")
              echo "→ skills-ref validate $skill_dir"
              if ! skills-ref validate "$skill_dir"; then
                fail=1
              fi
            done
          fi

          exit $fail

  mirror-check:
    name: Root ↔ skills/<name>/ mirror parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert mirror byte-identical to root source of truth
        run: ./scripts/mirror-skill.sh --check

  marketplace-spec:
    name: Claude Code marketplace spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace + plugin wrapper
        run: claude plugin validate .
