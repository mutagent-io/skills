name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sanitization:
    name: Sanitization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify no internal references leaked
        run: ./scripts/sanitize.py --check

  version-bump:
    name: SKILL_VERSION bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SKILL_VERSION bump for changed skills
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          fail=0
          for skill_dir in */; do
            skill="${skill_dir%/}"
            [[ -f "$skill/SKILL.md" ]] || continue

            # Files changed in this PR under this skill, excluding CHANGELOG.md
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- "$skill/" \
              | grep -v "^$skill/CHANGELOG.md$" || true)
            [[ -n "$changed" ]] || continue

            # If SKILL.md is new on this PR, this is a new skill — exempt.
            if ! git cat-file -e "origin/$BASE_REF:$skill/SKILL.md" 2>/dev/null; then
              echo "✓ $skill: new skill (no version-bump check needed)"
              continue
            fi

            prev=$(git show "origin/$BASE_REF:$skill/SKILL.md" \
              | awk -F': *' '/^SKILL_VERSION:/ { print $2; exit }')
            curr=$(awk -F': *' '/^SKILL_VERSION:/ { print $2; exit }' "$skill/SKILL.md")

            if [[ "$prev" == "$curr" ]]; then
              echo "::error file=$skill/SKILL.md::Files in $skill/ changed but SKILL_VERSION is still $curr — bump it before merging."
              fail=1
            else
              echo "✓ $skill: SKILL_VERSION $prev → $curr"
            fi
          done
          exit $fail
