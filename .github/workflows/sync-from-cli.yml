name: Sync from CLI

on:
  schedule:
    # Daily at 06:00 UTC. The CLI is typically published earlier in the day;
    # this gives the upstream release time to propagate before the sync runs.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version to sync (npm spec, e.g. "0.1.180" or "latest")'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  sync:
    name: Sync mutagent-cli skill from npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # Outputs consumed by the audit-leaks job (gated, off by default).
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      cli_version: ${{ steps.sync.outputs.cli_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sync script
        id: sync
        env:
          # Validated as a pure semver/dist-tag string before use; never
          # interpolated directly into a shell string.
          INPUT_VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: |
          set -euo pipefail

          # Defense-in-depth: even though workflow_dispatch is maintainer-only,
          # constrain the version input to npm-safe characters before passing
          # it to the script.
          if [[ ! "$INPUT_VERSION" =~ ^(latest|[0-9a-zA-Z._+-]+)$ ]]; then
            echo "::error::Invalid version input: '$INPUT_VERSION'"
            exit 1
          fi

          ./scripts/sync-from-cli.sh "$INPUT_VERSION"

          # Capture the resolved CLI version from the now-bumped marketplace
          # plugin entry. The sync script is responsible for keeping this in
          # sync with the npm package it pulled.
          version=$(python3 -c "
          import json
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          entry = next(p for p in data['plugins'] if p['name'] == 'mutagent')
          print(entry['version'])
          ")
          echo "cli_version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          # Root is source of truth; skills/<name>/ is the byte-identical
          # mirror enforced by validate.yml. Watch all three areas.
          if git diff --quiet -- \
              SKILL.md CHANGELOG.md concepts/ workflows/ \
              skills/ \
              .claude-plugin/marketplace.json .claude-plugin/plugin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-sync PR
        if: steps.diff.outputs.changed == 'true'
        # Pinned to peter-evans/create-pull-request v8.1.1 commit SHA.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: sync/cli-v${{ steps.sync.outputs.cli_version }}
          base: main
          title: "sync: mutagent-cli skill from CLI v${{ steps.sync.outputs.cli_version }}"
          body: |
            Automated sync from `@mutagent/cli@${{ steps.sync.outputs.cli_version }}`.

            **Action items before merge:**
            - [ ] Review the diff for unexpected behavioral changes:
                  `git diff -- SKILL.md CHANGELOG.md concepts/ workflows/ skills/ .claude-plugin/`
            - [ ] Update `CHANGELOG.md` (root) with a `[${{ steps.sync.outputs.cli_version }}]` entry.
                  `scripts/mirror-skill.sh` regenerates the `skills/mutagent-cli/` mirror.

            On merge: `tag-on-merge.yml` pushes `mutagent/v${{ steps.sync.outputs.cli_version }}`,
            and `release.yml` builds the GitHub Release with tarball.
          commit-message: "sync: mutagent-cli skill from CLI v${{ steps.sync.outputs.cli_version }}"
          delete-branch: true
          labels: |
            automated
            sync

      - name: Report no-op
        if: steps.diff.outputs.changed == 'false'
        env:
          CLI_VERSION: ${{ steps.sync.outputs.cli_version }}
        run: |
          echo "Already in sync with CLI v$CLI_VERSION — no PR opened."

  # ============================================================================
  # Optional second-pass leak audit using Claude Code.
  # ============================================================================
  #
  # Disabled by default. To enable:
  #   1. Add repo secret  `ANTHROPIC_API_KEY`     (Settings → Secrets → Actions)
  #   2. Add repo variable `ENABLE_CLAUDE_AUDIT` set to "true"
  #                                              (Settings → Variables → Actions)
  #
  # When enabled, this job runs on every auto-sync PR that has a non-empty
  # diff. It instructs Claude to read scripts/sanitize.py, then review the
  # changed mutagent-cli/ files for any internal references the regex-based
  # sanitizer would miss (semantic leaks: "Mirrored in...", "Canonical
  # source: ...", references to internal RFCs, etc.). Claude posts a PR
  # review comment with offending lines + a proposed RULES tuple to add to
  # scripts/sanitize.py. The maintainer applies the rule and re-runs sync.
  #
  # The deterministic regex sanitizer (validate.yml's --check) remains the
  # floor. Claude is the long-tail catcher.
  audit-leaks:
    name: Claude leak audit (opt-in)
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' && vars.ENABLE_CLAUDE_AUDIT == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/cli-v${{ needs.sync.outputs.cli_version }}
          persist-credentials: false

      # Pinned to anthropics/claude-code-action v1.0.115 commit SHA.
      - uses: anthropics/claude-code-action@9db782c3a17ef2bfc274cd17411bc3e0a5ba1345  # v1.0.115
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing an automated sync PR for the **public** MutagenT
            skills registry. The diff brings markdown content from a private
            monorepo via `npm install @mutagent/cli`. The script
            `scripts/sanitize.py` already strips known internal references via
            regex rules.

            Your job: catch internal references the regex misses.

            Steps:
            1. Read `scripts/sanitize.py` to understand which patterns are
               already handled (RULES list and LEAK_PATTERNS).
            2. Read every changed file under `mutagent-cli/`.
            3. Flag anything internal that the regex would not catch:
               - Source/test file paths the rules don't cover
               - Mentions of internal repos, decision records, RFCs, ADRs
               - Phrases like "Mirrored in...", "Canonical source: ...",
                 "Internal team contact: ...", "see #channel-name"
               - Anything that wouldn't make sense to a public reader

            4. If you find a leak: post a PR review comment with the
               offending lines AND a proposed Python tuple to add to the
               RULES list in `scripts/sanitize.py`. Format the tuple as:
                   ("<relative_path>", "<find_string>", "<replace_string>")
               Use multi-line strings in the tuple as needed.

            5. If clean: post a single PR comment
                   "✓ Claude audit clean — no internal references detected
                    beyond what scripts/sanitize.py already handles."

            Do NOT modify files yourself. The maintainer applies the rule
            manually so the rule lands as a reviewable, testable change.
